spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: 192.168.199.128
    port: 6379
    password: 123456
    lettuce:
      pool:
        max-active: 100
        max-idle: 20
        min-idle: 2
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  #程序启动的时候就和数据库建立连接
  mvc:
    servlet:
      load-on-startup: 1


# Web 容器：为秒杀瞬时洪峰预留线程与连接余量（默认 threads.max=200 / accept-count=100）
server:
  tomcat:
    threads:
      max: 500
    max-connections: 8192
    accept-count: 1000


mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
  configuration:
    map-underscore-to-camel-case: true


logging:
  level:
    com.hmdp: debug


# RocketMQ（Windows 本机 NameServer，部署步骤见 docs/ROCKETMQ-DEPLOY.md）
# 注意：引入 starter 后应用启动即连接 NameServer，必须先启动 RocketMQ 再启动应用
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: seckill-producer-group
    send-message-timeout: 3000


# 秒杀可调参数（与代码 @Value 默认值一致；与 README-UPGRADE 第七节对应）。
# pay-timeout-minutes 同时被两条关单路径读取：延迟消息主链路（handleOrderTimeout/tryCloseOrder）
# 与对账扫表兜底（ReconciliationTask.closeTimeoutOrders），改这一处两条路径同步生效
seckill:
  pay-timeout-minutes: 15            # 支付超时（关单时长）；测试时可改 1
  reconcile-initial-delay-ms: 30000  # 对账首轮延迟
  reconcile-interval-ms: 60000       # 对账间隔
